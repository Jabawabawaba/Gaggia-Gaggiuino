  <!-- Barista school: the machine from the front, forked from learn-sim.html (Run the machine); school-sim.js runs it -->
      <svg id="sim-front" class="simf" viewBox="0 -22 560 492" role="group" aria-label="The machine from the front">
        <defs>
          <linearGradient id="sf-steel" x1="0" x2="1"><stop offset="0" stop-color="#8F989F"/><stop offset=".22" stop-color="#E4E8EB"/><stop offset=".5" stop-color="#C6CDD2"/><stop offset=".78" stop-color="#E9ECEE"/><stop offset="1" stop-color="#868F96"/></linearGradient>
          <linearGradient id="sf-steelh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF1F3"/><stop offset=".6" stop-color="#C3CAD0"/><stop offset="1" stop-color="#959EA5"/></linearGradient>
          <linearGradient id="sf-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3F44"/><stop offset="1" stop-color="#15181B"/></linearGradient>
          <linearGradient id="sf-rockp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1012"/><stop offset="1" stop-color="#26292D"/></linearGradient>
          <linearGradient id="sf-recess" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B636A"/><stop offset=".18" stop-color="#9BA3AA"/><stop offset="1" stop-color="#B9C0C6"/></linearGradient>
          <radialGradient id="sf-neon"><stop offset="0" stop-color="#FFE7B0"/><stop offset=".45" stop-color="#FF9A2E"/><stop offset="1" stop-color="#E2541A"/></radialGradient>
          <radialGradient id="sf-red"><stop offset="0" stop-color="#FFD0C4"/><stop offset=".5" stop-color="#FF4A33"/><stop offset="1" stop-color="#B3170C"/></radialGradient>
          <pattern id="sf-brush" width="5" height="60" patternUnits="userSpaceOnUse"><line x1="1" y1="0" x2="1" y2="60" stroke="#FFFFFF" stroke-opacity=".16"/><line x1="3.5" y1="0" x2="3.5" y2="60" stroke="#000000" stroke-opacity=".04"/></pattern>
          <pattern id="sf-grate" width="7" height="9" patternUnits="userSpaceOnUse"><rect width="7" height="9" fill="#C9CFD4"/><rect x="1.5" y="2" width="4" height="5" rx="1.5" fill="#3B4045"/></pattern>
          <filter id="sf-glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>
        <rect class="counter" x="0" y="448" width="560" height="24"/>

        <!-- a plain wall clock: the time going by -->
        <g class="clock" transform="translate(62 72)">
          <circle r="40" class="clk-rim"/><circle r="35" class="clk-face"/>
          <g class="clk-ticks"><line y1="-33" y2="-27"/><line y1="-33" y2="-27" transform="rotate(30)"/><line y1="-33" y2="-27" transform="rotate(60)"/><line y1="-33" y2="-27" transform="rotate(90)"/><line y1="-33" y2="-27" transform="rotate(120)"/><line y1="-33" y2="-27" transform="rotate(150)"/><line y1="-33" y2="-27" transform="rotate(180)"/><line y1="-33" y2="-27" transform="rotate(210)"/><line y1="-33" y2="-27" transform="rotate(240)"/><line y1="-33" y2="-27" transform="rotate(270)"/><line y1="-33" y2="-27" transform="rotate(300)"/><line y1="-33" y2="-27" transform="rotate(330)"/></g>
          <line id="f-hhr" class="clk-hr" y1="4" y2="-17"/><line id="f-hmin" class="clk-min" y1="5" y2="-26"/><line id="f-hsec" class="clk-sec" y1="8" y2="-30"/><circle r="2.6" class="clk-cap"/>
        </g>

        <!-- body -->
        <rect x="146" y="430" width="34" height="18" rx="3" class="foot"/><rect x="380" y="430" width="34" height="18" rx="3" class="foot"/>
        <rect x="124" y="30" width="312" height="14" rx="4" fill="url(#sf-steelh)" class="edge"/>
        <path d="M134,34 H426" class="ridge"/><path d="M134,38 H426" class="ridge"/>
        <rect x="130" y="42" width="300" height="354" rx="10" fill="url(#sf-steel)" class="edge"/>
        <rect x="130" y="42" width="300" height="354" rx="10" fill="url(#sf-brush)"/>
        <rect x="422" y="46" width="8" height="346" fill="#000" opacity=".14"/>
        <rect x="152" y="226" width="256" height="170" rx="6" fill="url(#sf-recess)" class="recess"/>
        <rect x="250" y="188" width="60" height="10" rx="5" class="badge"/>

        <!-- switches, Pro family: power, brew, steam, each with its lamp below -->
        <g class="pro-only">
          <g id="f-sw-pwr" class="rock" role="button" tabindex="0" aria-pressed="false" aria-label="Power switch" transform="translate(230 104)">
            <rect x="-17" y="-24" width="34" height="48" rx="6" class="bezel"/>
            <rect x="-14" y="-21" width="28" height="21" rx="3" class="rk-top"/><rect x="-14" y="0" width="28" height="21" rx="3" class="rk-bot"/>
            <path d="M-4.6,-14.5 A6,6 0 1 0 4.6,-14.5 M0,-18 V-10.5" class="ico"/>
          </g>
          <g id="f-sw-brew" class="rock" role="button" tabindex="0" aria-pressed="false" aria-label="Brew switch" transform="translate(280 104)">
            <rect x="-17" y="-24" width="34" height="48" rx="6" class="bezel"/>
            <rect x="-14" y="-21" width="28" height="21" rx="3" class="rk-top"/><rect x="-14" y="0" width="28" height="21" rx="3" class="rk-bot"/>
            <path d="M-6,-15 H4 V-11 Q4,-7 0,-7 H-2 Q-6,-7 -6,-11 Z M4,-13.5 Q7.5,-13.5 7.5,-11.5 Q7.5,-9.5 4,-9.5 M-8,-4.5 H6" class="ico"/>
          </g>
          <g id="f-sw-steam" class="rock" role="button" tabindex="0" aria-pressed="false" aria-label="Steam switch" transform="translate(330 104)">
            <rect x="-17" y="-24" width="34" height="48" rx="6" class="bezel"/>
            <rect x="-14" y="-21" width="28" height="21" rx="3" class="rk-top"/><rect x="-14" y="0" width="28" height="21" rx="3" class="rk-bot"/>
            <path d="M-5,-4 C-8,-8 -2,-11 -5,-17 M0,-4 C-3,-8 3,-11 0,-17 M5,-4 C2,-8 8,-11 5,-17" class="ico"/>
          </g>
          <g class="lamp" id="f-lp-pwr" role="img" aria-label="Power lamp, off"><circle cx="230" cy="148" r="8" class="lp-bez"/><circle cx="230" cy="148" r="5.5" class="lp"/><circle cx="230" cy="148" r="9" class="lp-halo" filter="url(#sf-glow)"/></g>
          <g class="lamp" id="f-lp-brew" role="img" aria-label="Brew lamp, off"><circle cx="280" cy="148" r="8" class="lp-bez"/><circle cx="280" cy="148" r="5.5" class="lp"/><circle cx="280" cy="148" r="9" class="lp-halo" filter="url(#sf-glow)"/></g>
          <g class="lamp" id="f-lp-steam" role="img" aria-label="Steam lamp, off"><circle cx="330" cy="148" r="8" class="lp-bez"/><circle cx="330" cy="148" r="5.5" class="lp"/><circle cx="330" cy="148" r="9" class="lp-halo" filter="url(#sf-glow)"/></g>
        </g>
        <!-- switches, original Classic: one molded housing; the power and brew rockers light from inside -->
        <g class="gc-only">
          <rect x="212" y="74" width="136" height="64" rx="9" class="housing"/>
          <g id="f-gsw-pwr" class="rock lit-rk" role="button" tabindex="0" aria-pressed="false" aria-label="Power switch" transform="translate(237 106)">
            <rect x="-14" y="-22" width="28" height="22" rx="3" class="rk-top"/><rect x="-14" y="0" width="28" height="22" rx="3" class="rk-bot"/>
            <path d="M0,-17 V-6" class="ico"/><circle cx="0" cy="11" r="4.5" class="ico"/>
          </g>
          <g id="f-gsw-steam" class="rock" role="button" tabindex="0" aria-pressed="false" aria-label="Steam switch" transform="translate(280 106)">
            <rect x="-20" y="-22" width="40" height="22" rx="3" class="rk-top"/><rect x="-20" y="0" width="40" height="22" rx="3" class="rk-bot"/>
            <path d="M-5,-4 C-8,-8 -2,-11 -5,-17 M0,-4 C-3,-8 3,-11 0,-17 M5,-4 C2,-8 8,-11 5,-17" class="ico"/>
          </g>
          <g id="f-gsw-brew" class="rock lit-rk" role="button" tabindex="0" aria-pressed="false" aria-label="Brew switch" transform="translate(323 106)">
            <rect x="-14" y="-22" width="28" height="22" rx="3" class="rk-top"/><rect x="-14" y="0" width="28" height="22" rx="3" class="rk-bot"/>
            <path d="M-6,-15 H4 V-11 Q4,-7 0,-7 H-2 Q-6,-7 -6,-11 Z M4,-13.5 Q7.5,-13.5 7.5,-11.5 Q7.5,-9.5 4,-9.5 M-8,-4.5 H6" class="ico"/>
          </g>
        </g>

        <!-- group head -->
        <rect x="238" y="220" width="84" height="27" rx="4" fill="url(#sf-steel)" class="edge"/>
        <path d="M232,228 H238 M322,228 H328" class="ears"/>
        <line x1="242" y1="246" x2="318" y2="246" class="gasket"/>
        <g id="f-gflash"></g>

        <!-- steam wand: a commercial wand on the Pro family, a Panarello on the original Classic -->
        <circle cx="398" cy="156" r="7.5" fill="url(#sf-steel)" class="edge"/>
        <g class="pro-only"><path d="M398,162 C398,210 386,232 383,262 L380.5,321" class="wand"/><rect x="376" y="319" width="9" height="14" rx="3" class="wandtip"/><rect id="f-wandmilk" x="375.5" y="310" width="10" height="23" rx="3.5" class="wandmilk"/></g>
        <g class="gc-only"><path d="M398,162 C398,210 386,232 384,262 L382,276" class="wand"/><rect x="374" y="274" width="16" height="58" rx="6" class="panarello"/><line x1="377" y1="286" x2="387" y2="286" class="pan-rib"/><rect id="f-wandmilk-gc" x="373.5" y="300" width="17" height="32" rx="6" class="wandmilk"/></g>

        <!-- steam knob, on the right side -->
        <rect x="430" y="102" width="9" height="16" rx="2" fill="url(#sf-steelh)" class="edge"/>
        <g id="f-knob" class="knobhit" role="button" tabindex="0" aria-pressed="false" aria-label="Steam knob" transform="translate(447 110)">
          <circle r="15" class="knob"/><circle r="11.5" class="knob-rib"/><g id="f-knobp"><line x1="0" y1="-12.5" x2="0" y2="-5" class="knob-ptr"/></g>
        </g>

        <!-- drip tray -->
        <g id="f-tray" role="button" tabindex="0" aria-label="Drip tray: empty it">
          <rect x="150" y="386" width="260" height="11" rx="2" fill="url(#sf-grate)" class="grate"/>
          <rect id="f-trayw" x="150" y="386" width="260" height="11" rx="2" class="trayw"/>
          <rect x="148" y="396" width="264" height="38" rx="4" fill="url(#sf-steel)" class="edge"/>
          <rect x="262" y="420" width="36" height="5" rx="2.5" class="pull"/>
        </g>
        <ellipse id="f-puddle" cx="280" cy="452" rx="0" ry="0" class="puddle"/>

        <!-- a coffee scale on the drip tray, under the cup -->
        <g id="f-scale">
          <rect x="242" y="377" width="76" height="9" rx="2.5" class="scl-body"/>
          <rect x="248" y="375" width="64" height="3" rx="1.5" class="scl-plate"/>
          <rect x="266" y="379" width="28" height="6" rx="1" class="scl-lcd"/>
          <text id="f-scale-g" x="292.5" y="384" class="scl-txt">0.0</text>
        </g>

        <!-- what comes out: from the group, the spouts and the wand -->
        <g id="f-streams">
          <path id="f-gs1" class="fs water" d="M264,247 V390"/><path id="f-gs2" class="fs water" d="M280,247 V390"/><path id="f-gs3" class="fs water" d="M296,247 V390"/>
          <path id="f-ss1" class="fs" d="M272,282 V390"/><path id="f-ss2" class="fs" d="M288,282 V390"/>
          <path id="f-ws" class="fs water" d="M380.5,333 V390"/>
        </g>

        <!-- portafilter: locked in, or on the counter -->
        <g id="f-pf" class="pfhit" role="button" tabindex="0" aria-label="Portafilter: take it out">
          <path d="M254,262 L184,302" class="pf-handle"/>
          <path d="M254,262 L238,271" class="pf-neck"/>
          <path d="M246,247 H314 L308,270 H252 Z" fill="url(#sf-steel)" class="edge"/>
          <path d="M248,252 H312" class="pf-ear"/>
          <rect x="268" y="270" width="8" height="12" rx="2" class="spout"/><rect x="284" y="270" width="8" height="12" rx="2" class="spout"/>
          <path d="M246,246 H316 L310,286 H262 L196,312 L176,296 L246,258 Z" class="hit"/>
        </g>
        <g id="f-pfout">
          <g id="f-pfhandle" class="pfhit" role="button" tabindex="0" aria-label="Portafilter: lock it in"><path d="M64,432 L10,440" class="pf-handle"/><path d="M64,432 L56,433" class="pf-neck"/><rect x="2" y="424" width="60" height="24" class="hit"/></g>
          <g id="f-pfbasket" class="pfhit" role="button" tabindex="0" aria-label="Basket: knock out or fill">
            <path d="M62,432 Q62,446 92,446 Q122,446 122,432 Z" fill="url(#sf-steel)" class="edge"/>
            <ellipse cx="92" cy="432" rx="30" ry="8.5" fill="url(#sf-steelh)" class="edge"/>
            <ellipse id="f-pfc" cx="92" cy="432" rx="24.5" ry="6" class="pfc"/>
            <g id="f-pfgr"><ellipse cx="92" cy="431" rx="21" ry="4.2" class="grounds"/><ellipse cx="86" cy="430.5" rx="5" ry="1.2" class="grounds-hi"/></g>
            <g id="f-pfblind"><ellipse cx="92" cy="432" rx="24.5" ry="6" class="blindb"/><ellipse cx="92" cy="431.4" rx="10" ry="2.2" class="blindh"/></g>
            <rect x="60" y="420" width="64" height="28" class="hit"/>
          </g>
        </g>

        <!-- cup and milk jug -->
        <g id="f-cup" class="cuphit" role="button" tabindex="0" aria-label="Cup: move it">
          <ellipse cx="0" cy="0" rx="25" ry="3.6" class="saucer"/>
          <path d="M-18,-40 H18 L15,-5 Q14,-1 10,-1 H-10 Q-14,-1 -15,-5 Z" class="cupb"/>
          <path d="M17,-31 Q28,-31 28,-21 Q28,-13 15,-12" class="cuph"/>
          <g id="f-cupvap"><path d="M-6,-46 C-10,-54 -2,-58 -6,-66" class="vap"/><path d="M4,-46 C0,-54 8,-58 4,-66" class="vap"/></g>
          <rect x="-26" y="-44" width="58" height="49" class="hit"/>
        </g>
        <g id="f-jug" class="jughit" role="button" tabindex="0" aria-label="Milk jug: move it">
          <path d="M-24,-66 L-31,-74 H21 L25,-66 L24,-6 Q24,0 18,0 H-18 Q-24,0 -24,-6 Z" fill="url(#sf-steel)" class="edge"/>
          <path d="M24,-58 Q40,-56 40,-38 Q40,-22 24,-20" class="jugh"/>
          <g id="f-jugth"><line x1="10" y1="-92" x2="10" y2="-62" class="th-stem"/><circle cx="10" cy="-96" r="7" class="th-dial"/><line id="f-thn" x1="10" y1="-96" x2="10" y2="-101.5" class="th-n"/></g>
          <rect x="-32" y="-78" width="74" height="80" class="hit"/>
        </g>
        <g id="f-puffs"></g>
      </svg>
